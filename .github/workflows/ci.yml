name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }} / ubuntu-latest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: tool-guard-kit tests
        working-directory: packages/tool-guard-kit
        run: node --test test/*.test.mjs

      # `tools.integration.test.mjs` falls back to a built-in zero-dependency
      # JSON-Schema validator when `@deepseek-ai/dsh-tools` is absent, so all
      # 21 suites run in CI.
      - name: payload budgets
        working-directory: packages/agent-team-workflow
        run: node bench/measure-payloads.mjs --check

      - name: agent-team-workflow full test suite
        working-directory: packages/agent-team-workflow
        run: node --test test/*.test.mjs
