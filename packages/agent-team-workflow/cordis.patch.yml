# Agent Team Workflow — injected collaboration protocol for Agent Teams.
#
# The row is additive: it never disables the shipped Team runtime or the nine
# Team tools; it layers a workflow state machine, review protocol, and quality
# gates on top of `ctx.agentTeams` and the existing shared task board.
- insert:
    - id: agent-team-workflow
      name: '@local/dsh-agent-team-workflow'
      config:
        # Artifact directory (relative to the Team working directory, or absolute).
        artifactsDir: .agentteam
        # Persist state.json + report.md; false keeps the run in memory only.
        writeArtifacts: true
        # Inject the workflow protocol into every Team member system prompt.
        injectPolicy: true
        # Maximum review rounds per work item before mandatory Lead arbitration.
        maxReviewRounds: 2
        # Recommended maximum work items in one execution wave.
        maxParallelItems: 4
        # Maximum work items in one run.
        maxItems: 12
        # Context mode for spawned workers: fresh keeps execution independent.
        workerContext: fresh
        # Treat reported files outside declared write scopes as a gate failure.
        strictScopes: false
        # Also deny native write/edit calls outside the caller's write scopes at runtime.
        enforceWriteScopes: false
        # Allow overlapping write scopes inside one wave (recorded as a warning).
        allowScopeOverlap: false
        # Notify the reviewer/author automatically on review transitions.
        autoNotify: true
        # Reject an approving review that declares no inspected evidence.
        requireReviewEvidence: true
        # Minutes an open proposal waits for votes before lazy settlement (0 disables).
        proposalTimeoutMinutes: 15
        # Spawn/wake the members a plan needs automatically (false = return prompts only).
        autoStaff: true
        # Git/PR workflow: off by default; enable per deployment.
        gitEnabled: false
        gitBaseBranch: main
        gitRemote: origin
        gitBranchPrefix: agentteam/
        # Verification commands the `verify` action runs (e.g. ["pnpm -r test"]).
        gitVerifyCommands: []
        # Require item git verification before the gate accepts it.
        gitRequireVerify: false
        # DSH providers used for auto-spawned teammates (native defaults).
        freshProvider: spawn
        forkProvider: fork
        # Reusable roles: provider picks the model (DSH provider config), prompt
        # appends domain guidance to that member's brief. Example:
        # roles:
        #   security-reviewer:
        #     provider: review-fast
        #     prompt: You focus on auth, secrets and injection risks.
        roles: {}
        # Lifecycle hooks (exit code 2 vetoes the action; event JSON on stdin).
        # hooks:
        #   taskCreated:
        #     - command: .agentteam/hooks/check-scope.sh
        #   taskCompleted:
        #     - command: pnpm -s test
        #   teammateIdle:
        #     - command: .agentteam/hooks/idle-check.sh
        hooks: {}
        # Plan-first workflow: items must submit a short plan before reporting.
        planFirst: false
        # Auto-approve an unreviewed plan (official default), or require a human step.
        autoApprovePlan: true
        # Who approves plans: the Lead or the item's first peer reviewer.
        planApprover: lead
        # Token budgets (0 = off): gate fails when a member or the run exceeds them.
        tokenBudgetPerMember: 0
        tokenBudgetPerRun: 0
        # Per-item git worktree isolation: off | serial (one active worktree) | parallel (one per item).
        # Parallel mode isolates overlapping write scopes and lets items commit/verify in their own checkout.
        worktreeIsolation: off
        # Autonomous state machine: auto-wake unblocked workers, auto-wake reviewers, and watchdog.
        autoOrchestrate: true
        autoWakeUnblocked: true
        autoWakeReviewers: true
        autoNotifyConverged: true
        autoFinalize: false
        watchdogIntervalSeconds: 30
